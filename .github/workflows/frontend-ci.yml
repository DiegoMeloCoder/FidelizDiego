name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend # Set working directory for all steps

    strategy:
      matrix:
        node-version: [18.x, 20.x] # Test on common Node versions

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json # Cache deps based on frontend lock file

    - name: Install Dependencies
      run: npm ci # Use ci for faster, more reliable installs in CI

    - name: Run Linter (ESLint)
      run: npm run lint

    # - name: Run Tests # Placeholder for future tests
    #   run: npm test -- --coverage # Assuming Jest/RTL tests

    # - name: Build Project # Optional: Check if build succeeds
    #   run: npm run build
